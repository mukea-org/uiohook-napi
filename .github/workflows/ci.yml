name: Prebuild

on:
  push:
  workflow_dispatch:

concurrency:
  group: prebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-js:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: node -v
      - run: cmake --version
      - run: pnpm -v
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

  prebuild-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: node -v
      - run: cmake --version
      - run: pnpm -v

      - name: Clear pnpm cache
        run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: node ./scripts/build-prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: prebuilds

  prebuild-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: node -v
      - run: cmake --version
      - run: pnpm -v

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxrandr-dev \
            libxt-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev

      - name: Clear pnpm cache
        run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: node ./scripts/build-prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: prebuilds

  prebuild-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: node -v
      - run: cmake --version
      - run: pnpm -v

      - name: Clear pnpm cache
        run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: node ./scripts/build-prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: prebuilds

  build-package:
    needs:
      - validate-js
      - prebuild-windows
      - prebuild-linux
      - prebuild-darwin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: node -v
      - run: cmake --version
      - run: pnpm -v

      - name: Clear pnpm cache
        run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: node ./scripts/verify-prebuilds.mjs
      - run: node -e "process.env.PREBUILDS_ONLY='1'; require('./dist/index.js')"
      - run: npm pack


      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "mukea-uiohook-napi-*.tgz"

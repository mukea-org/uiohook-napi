name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify git tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version: $package_version"
            echo "git tag version: $tag_version"
            exit 1
          fi

  prebuild-windows:
    needs: validate-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-windows
          path: prebuilds

  prebuild-linux:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxrandr-dev \
            libxt-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev

      - run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux
          path: prebuilds

  prebuild-darwin:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/prebuild.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-darwin
          path: prebuilds

  package:
    needs:
      - prebuild-windows
      - prebuild-linux
      - prebuild-darwin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Linux runtime dependencies for prebuilt validation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-xkb1 \
            libxrandr2 \
            libxt6 \
            libxtst6 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - run: pnpm store prune
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/build.mjs
      - run: node -e "const pkg = require('./dist/index.js'); if (pkg.uIOhook == null) throw new Error('Missing uIOhook export')"
      - name: Verify packaged prebuilds are present
        shell: bash
        run: |
          find prebuilds -type f -name '*.node' | grep -q .
      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v4
        with:
          name: package-workspace
          path: |
            dist
            prebuilds
            package.json
            README.md
            LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: "mukea-uiohook-napi-*.tgz"

  publish-github-packages:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-workspace
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Determine publish tag
        shell: bash
        run: |
          publish_tag=$(node -p "const version = require('./package.json').version; const prerelease = version.split('-', 2)[1]; prerelease ? prerelease.split('.')[0] : 'latest'")
          echo "PUBLISH_TAG=$publish_tag" >> "$GITHUB_ENV"

      - name: Rename package for GitHub Packages namespace
        run: npm pkg set name=@mukea-org/uiohook-napi

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --tag "$PUBLISH_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    needs:
      - package
      - publish-github-packages
    if: always() && needs.package.result == 'success' && needs.publish-github-packages.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-workspace
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Determine publish tag
        shell: bash
        run: |
          publish_tag=$(node -p "const version = require('./package.json').version; const prerelease = version.split('-', 2)[1]; prerelease ? prerelease.split('.')[0] : 'latest'")
          echo "PUBLISH_TAG=$publish_tag" >> "$GITHUB_ENV"

      - name: Publish to npmjs
        run: npm publish --access public --tag "$PUBLISH_TAG"
